[package]
name = "redox-scheme"
authors = ["4lDO2 <4lDO2@protonmail.com>"]
# Always bump the version in a separate commit, which only changes the version.
version = "0.12.0"
edition = "2024"
license = "MIT"
exclude = ["target"]
repository = "https://gitlab.redox-os.org/redox-os/redox-scheme"
description = "Library for writing Redox scheme daemons"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# TODO: hashbrown separately?
default = ["std"]
std = []

[dependencies]
redox_syscall = "0.9.5"
libredox = { version = "0.1.18", default-features = false, features = ["redox_syscall", "call"] }
