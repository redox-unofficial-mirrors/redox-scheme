[package]
name = "redox-scheme"
authors = ["4lDO2 <4lDO2@protonmail.com>"]
version = "0.2.0"
edition = "2021"
license = "MIT"
exclude = ["target"]
repository = "https://gitlab.redox-os.org/redox-os/redox-scheme"
description = "Library for writing Redox scheme daemons"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
redox_syscall = "0.5"
libredox = { version = "0.1.3", default-features = false, features = ["redox_syscall", "call"] }

[patch.crates-io]
redox_syscall = { git = "https://gitlab.redox-os.org/4lDO2/syscall.git", branch = "schemev2" }
